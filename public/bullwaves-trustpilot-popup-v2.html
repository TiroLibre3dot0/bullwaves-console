<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullwaves Trustpilot Popup — Light</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --card-bg:       #ffffff;
        --border:        rgba(13, 31, 56, 0.10);
        --text-main:     #0d1f38;
        --text-sub:      #2d4a6e;
        --text-muted:    #8097b1;
        --navy:          #0d1f38;
        --tp-green:      #00b67a;
        --tp-green-dark: #009e6b;
        --star:          #fbbf24;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--text-main);
        background:
          radial-gradient(ellipse 80% 60% at 10% 0%,   #e8f4ff 0%, transparent 60%),
          radial-gradient(ellipse 60% 80% at 90% 100%,  #d6ecff 0%, transparent 60%),
          #f0f7ff;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      /* ── Card ─────────────────────────────── */
      .popup {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow:
          0 2px  4px  rgba(13, 31, 56, 0.04),
          0 8px  24px rgba(13, 31, 56, 0.08),
          0 32px 64px rgba(13, 31, 56, 0.10);
        width: min(100%, 780px);
        display: grid;
        grid-template-columns: 200px 1fr;
        overflow: hidden;
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(16px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }

      /* ── Left panel ───────────────────────── */
      .logo-panel {
        background:
          radial-gradient(ellipse 140% 80% at 50% 110%, #1a3a6b 0%, transparent 55%),
          linear-gradient(170deg, #162d4f 0%, var(--navy) 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        gap: 20px;
        position: relative;
        overflow: hidden;
      }

      /* subtle dot-grid texture */
      .logo-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 18px 18px;
        pointer-events: none;
      }

      .brand-logo {
        width: 130px;
        max-width: 100%;
        height: auto;
        position: relative;
        z-index: 1;
      }

      /* live Trustpilot badge pill */
      .tp-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 100px;
        padding: 5px 10px 5px 6px;
        font-size: 11px;
        font-weight: 600;
        color: rgba(255,255,255,0.72);
        letter-spacing: 0.4px;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }

      .tp-dot {
        width: 7px;
        height: 7px;
        background: var(--tp-green);
        border-radius: 50%;
        box-shadow: 0 0 0 3px rgba(0, 182, 122, 0.28);
        animation: pulse 2.2s ease infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 3px rgba(0, 182, 122, 0.28); }
        50%       { box-shadow: 0 0 0 5px rgba(0, 182, 122, 0.10); }
      }

      /* ── Right content ────────────────────── */
      .content {
        padding: 36px 36px 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 10px;
      }

      .title {
        font-size: clamp(24px, 2.8vw, 34px);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.5px;
        color: var(--text-main);
        margin-bottom: 20px;
      }

      /* stars + score in one row */
      .stars-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 6px;
      }

      .stars {
        display: flex;
        gap: 3px;
      }

      /* staggered pop-in for each star */
      .stars svg {
        display: block;
        animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        animation-delay: var(--d, 0s);
      }

      @keyframes pop {
        from { opacity: 0; transform: scale(0.3) rotate(-15deg); }
        to   { opacity: 1; transform: scale(1)   rotate(0deg);   }
      }

      .score-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-sub);
        white-space: nowrap;
      }

      .score-label strong {
        color: var(--text-main);
        font-size: 15px;
      }

      .review-count {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
        margin-bottom: 26px;
        margin-top: 2px;
      }

      /* CTA button */
      .cta-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--tp-green);
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.1px;
        padding: 13px 22px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        align-self: flex-start;
        transition: background 0.18s, transform 0.18s, box-shadow 0.18s;
        box-shadow: 0 4px 14px rgba(0, 182, 122, 0.35);
      }

      .cta-btn:hover {
        background: var(--tp-green-dark);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 182, 122, 0.45);
      }

      .cta-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(0, 182, 122, 0.28);
      }

      .cta-btn .arrow {
        transition: transform 0.18s;
      }

      .cta-btn:hover .arrow {
        transform: translateX(3px);
      }

      /* ── Responsive ───────────────────────── */
      @media (max-width: 620px) {
        .popup {
          grid-template-columns: 1fr;
          border-radius: 20px;
        }

        .logo-panel {
          flex-direction: row;
          padding: 18px 22px;
          gap: 14px;
          justify-content: flex-start;
        }

        .brand-logo {
          width: 100px;
        }

        .content {
          padding: 22px 22px 26px;
        }

        .title {
          font-size: clamp(22px, 6vw, 28px);
        }
      }
    </style>
  </head>
  <body>
    <section class="popup" role="dialog" aria-label="Richiesta feedback Trustpilot">

      <!-- Left: brand panel -->
      <div class="logo-panel" aria-hidden="true">
        <img class="brand-logo" src="/Logo.png" alt="Bullwaves" />
        <div class="tp-pill">
          <span class="tp-dot"></span>
          Trustpilot
        </div>
      </div>

      <!-- Right: content -->
      <div class="content">
        <p class="eyebrow">La tua opinione conta</p>
        <h1 class="title">Cosa ne pensi<br>di Bullwaves?</h1>

        <div class="stars-row">
          <div class="stars" aria-label="5 stelle su 5">
            <svg style="--d:.07s" width="28" height="28" viewBox="0 0 24 24"><path fill="var(--star)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
            <svg style="--d:.15s" width="28" height="28" viewBox="0 0 24 24"><path fill="var(--star)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
            <svg style="--d:.23s" width="28" height="28" viewBox="0 0 24 24"><path fill="var(--star)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
            <svg style="--d:.31s" width="28" height="28" viewBox="0 0 24 24"><path fill="var(--star)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
            <svg style="--d:.39s" width="28" height="28" viewBox="0 0 24 24"><path fill="var(--star)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
          </div>
          <span class="score-label"><strong>Eccellente</strong> · 4.9 / 5</span>
        </div>

        <p class="review-count">Basato su 1.200+ recensioni verificate</p>

        <a
          class="cta-btn"
          href="https://www.trustpilot.com/review/bullwaves.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Scrivi una recensione su Trustpilot"
        >
          Scrivi una recensione
          <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

    </section>
  </body>
</html>
