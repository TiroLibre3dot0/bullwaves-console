<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0036ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0024b3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative shapes -->
  <circle cx="100" cy="100" r="80" fill="rgba(0, 212, 255, 0.1)"/>
  <circle cx="1100" cy="550" r="120" fill="rgba(0, 96, 255, 0.1)"/>
  <rect x="800" y="50" width="200" height="200" fill="rgba(0, 212, 255, 0.05)" transform="rotate(45 900 150)"/>
  
  <!-- Main title -->
  <text x="60" y="120" font-size="72" font-weight="800" fill="white" font-family="Arial, sans-serif">
    Weekly Map
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="190" font-size="32" fill="rgba(0, 212, 255, 0.9)" font-family="Arial, sans-serif" font-weight="300">
    Project Management Execution Contract
  </text>
  
  <!-- Accent bar -->
  <rect x="60" y="220" width="150" height="6" fill="url(#accentGradient)" rx="3"/>
  
  <!-- Info cards -->
  <g>
    <!-- Card 1: Mega-Stories -->
    <rect x="60" y="280" width="280" height="140" fill="rgba(255, 255, 255, 0.08)" rx="12" stroke="rgba(0, 212, 255, 0.3)" stroke-width="2"/>
    <text x="90" y="320" font-size="18" fill="rgba(0, 212, 255, 0.7)" font-family="Arial, sans-serif" font-weight="600">
      MEGA-STORIES
    </text>
    <text x="90" y="360" font-size="28" fill="white" font-family="Arial, sans-serif" font-weight="700">
      6 Streams
    </text>
    <text x="90" y="390" font-size="14" fill="rgba(255, 255, 255, 0.6)" font-family="Arial, sans-serif">
      Strategic initiatives
    </text>
  </g>
  
  <!-- Card 2: Execution -->
  <g>
    <rect x="380" y="280" width="280" height="140" fill="rgba(255, 255, 255, 0.08)" rx="12" stroke="rgba(0, 212, 255, 0.3)" stroke-width="2"/>
    <text x="410" y="320" font-size="18" fill="rgba(0, 212, 255, 0.7)" font-family="Arial, sans-serif" font-weight="600">
      EXECUTION
    </text>
    <text x="410" y="360" font-size="28" fill="white" font-family="Arial, sans-serif" font-weight="700">
      Team Tasks
    </text>
    <text x="410" y="390" font-size="14" fill="rgba(255, 255, 255, 0.6)" font-family="Arial, sans-serif">
      Current week plan
    </text>
  </g>
  
  <!-- Card 3: Governance -->
  <g>
    <rect x="700" y="280" width="280" height="140" fill="rgba(255, 255, 255, 0.08)" rx="12" stroke="rgba(0, 212, 255, 0.3)" stroke-width="2"/>
    <text x="730" y="320" font-size="18" fill="rgba(0, 212, 255, 0.7)" font-family="Arial, sans-serif" font-weight="600">
      GOVERNANCE
    </text>
    <text x="730" y="360" font-size="28" fill="white" font-family="Arial, sans-serif" font-weight="700">
      Accountability
    </text>
    <text x="730" y="390" font-size="14" fill="rgba(255, 255, 255, 0.6)" font-family="Arial, sans-serif">
      Clear ownership
    </text>
  </g>
  
  <!-- Footer -->
  <text x="60" y="570" font-size="16" fill="rgba(255, 255, 255, 0.5)" font-family="Arial, sans-serif">
    Bullwaves Team Execution Dashboard — Shared Access
  </text>
  <circle cx="60" cy="560" r="4" fill="rgba(0, 212, 255, 0.7)"/>
  <circle cx="50" cy="560" r="4" fill="rgba(0, 212, 255, 0.5)"/>
  <circle cx="40" cy="560" r="4" fill="rgba(0, 212, 255, 0.3)"/>
</svg>
