<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trading Competition — Bullwaves</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #00a878;
  --text: #0d0d0f;
  --muted: #6b7280;
  --hint: #9ca3af;
  --border: #e5e7eb;
  --border2: #f0f0f2;
  --bg: #ffffff;
  --bg2: #f8f8f9;
  --bg3: #f3f4f6;
  --nav-bg: rgba(255,255,255,0.9);
  --nav-border: rgba(0,0,0,0.08);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Navbar */
.navbar {
  position: sticky; top: 0; z-index: 110;
  padding: 12px 16px;
  background: linear-gradient(90deg, rgba(5,12,18,0.9), rgba(8,20,28,0.86));
  border-bottom: 1px solid rgba(148,163,184,0.22);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  transition: padding .22s ease, background .22s ease;
}
.navbar-shell {
  max-width: 1280px;
  margin: 0 auto;
  min-height: 60px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 10px 16px;
  border-radius: 14px;
  border: 1px solid rgba(148,163,184,0.22);
  background: linear-gradient(135deg, rgba(15,23,42,0.82), rgba(15,23,42,0.66));
  box-shadow: 0 16px 36px rgba(2,6,23,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  transition: min-height .22s ease, padding .22s ease, border-radius .22s ease, box-shadow .22s ease;
}
.navbar-brand {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; flex-shrink: 0;
}
.navbar-logo {
  width: 44px; height: 44px; border-radius: 12px;
  display: block;
  overflow: hidden;
  background: rgba(255,255,255,0.1);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
  transition: width .22s ease, height .22s ease, border-radius .22s ease;
}
.navbar-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.navbar-branding { display: flex; flex-direction: column; gap: 2px; }
.navbar-title { font-size: 15px; font-weight: 800; letter-spacing: -0.03em; color: #f8fafc; transition: font-size .22s ease; line-height: 1.2; }
.navbar-subtitle { display: none; font-size: 11px; font-weight: 700; color: #cbd5e1; letter-spacing: 0.07em; text-transform: uppercase; transition: opacity .2s ease, transform .2s ease; }
.navbar-center {
  display: flex; align-items: center; justify-content: center;
  white-space: nowrap;
}
.navbar-center-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.navbar-center-title {
  font-size: 24px; font-weight: 800; letter-spacing: -0.05em; color: #f8fafc;
  text-transform: capitalize;
}
.affiliate-picker-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border: 1px solid rgba(148,163,184,0.24);
  border-radius: 999px;
  background: rgba(15,23,42,0.34);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.affiliate-picker-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #94a3b8;
}
.affiliate-picker {
  min-width: 210px;
  max-width: 280px;
  border: 0;
  outline: 0;
  background: transparent;
  color: #f8fafc;
  font: 700 12px/1.2 'Inter', sans-serif;
  letter-spacing: -0.02em;
  cursor: pointer;
}
.affiliate-picker option {
  color: #0f172a;
}
.navbar-pills { display: flex; align-items: center; gap: 10px; flex-shrink: 0; justify-self: end; }

.navbar.is-shrunk { padding: 8px 14px; }
.navbar.is-shrunk .navbar-shell {
  min-height: 52px;
  padding: 8px 14px;
  border-radius: 12px;
  gap: 20px;
  box-shadow: 0 10px 24px rgba(2,6,23,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
}
.navbar.is-shrunk .navbar-logo { width: 38px; height: 38px; border-radius: 10px; }
.navbar.is-shrunk .navbar-title { font-size: 14px; }
.navbar.is-shrunk .navbar-subtitle { opacity: 0.6; transform: translateY(-1px); }
.navbar.is-shrunk .navbar-center-title { font-size: 20px; }
.navbar.is-shrunk .navbar-center-stack { gap: 6px; }
.navbar.is-shrunk .affiliate-picker-wrap { padding: 5px 10px; }
.navbar.is-shrunk .affiliate-picker { font-size: 11px; min-width: 190px; }
.navbar.is-shrunk .pill { height: 30px; padding: 0 13px; font-size: 11px; }
.navbar.is-shrunk .live-dot { transform: scale(0.85); }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 13px; border-radius: 999px;
  font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer;
  transition: transform .15s, background .15s, border-color .15s, box-shadow .15s; white-space: nowrap;
}
.pill:hover { transform: translateY(-1px); }
.pill-outline { border: 1px solid rgba(148,163,184,0.32); background: rgba(15,23,42,0.22); color: #e2e8f0; }
.pill-outline:hover { background: rgba(148,163,184,0.12); border-color: rgba(148,163,184,0.54); color: #ffffff; }
.pill-green {
  border: 1px solid rgba(34,197,94,0.45);
  background: linear-gradient(90deg, rgba(16,185,129,0.2), rgba(34,197,94,0.18));
  color: #dcfce7;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
}
.pill-green:hover { background: linear-gradient(90deg, rgba(16,185,129,0.32), rgba(34,197,94,0.27)); border-color: rgba(34,197,94,0.65); }

.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); animation: blink 1.4s ease-in-out infinite; flex-shrink: 0;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* Page body */
.page-body { flex: 1; padding: 40px 24px 80px; }
.wrap { max-width: 1280px; margin: 0 auto; }
.layout { display: flex; gap: 28px; align-items: flex-start; }
.main { flex: 1; min-width: 0; }

/* Global page loader */
.page-loader {
  position: fixed;
  inset: 0;
  z-index: 1200;
  background: rgba(248, 250, 252, 0.18);
  backdrop-filter: blur(8px) saturate(112%);
  -webkit-backdrop-filter: blur(8px) saturate(112%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 1;
  visibility: visible;
  transition: opacity .28s ease, visibility .28s ease;
}
.page-loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.page-loader__inner {
  width: min(360px, calc(100vw - 40px));
  text-align: center;
  color: #e2e8f0;
  filter: drop-shadow(0 14px 30px rgba(2,6,23,0.28));
}
.page-loader__orb {
  width: 162px;
  height: 162px;
  margin: 0 auto 16px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  background: radial-gradient(circle at 50% 50%, rgba(15,23,42,0.3) 0%, rgba(15,23,42,0.72) 60%, rgba(15,23,42,0.92) 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 44px rgba(56,189,248,0.34);
  animation: bwLoaderFloat 3.2s ease-in-out infinite;
}
.page-loader__ring,
.page-loader__ring-2 {
  position: absolute;
  border-radius: 50%;
}
.page-loader__ring {
  inset: 12px;
  border: 1px solid rgba(56,189,248,0.2);
  animation: bwLoaderPulse 2.8s ease-in-out infinite;
}
.page-loader__ring-2 {
  inset: 28px;
  border: 1px solid rgba(34,197,94,0.2);
  animation: bwLoaderPulse 2.1s ease-in-out infinite reverse;
}
.page-loader__orb img {
  width: 108px;
  height: 108px;
  object-fit: contain;
  position: relative;
  z-index: 1;
}
.page-loader__subtitle {
  font-size: 12px;
  font-weight: 700;
  color: #cbd5e1;
  margin-bottom: 12px;
}
.page-loader__progress {
  position: relative;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(148,163,184,0.22);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
}
.page-loader__progress-fill {
  position: absolute;
  inset: 0;
  width: 0%;
  background: linear-gradient(90deg, #10b981 0%, #22c55e 55%, #86efac 100%);
  border-radius: 999px;
  transition: width 220ms ease;
  box-shadow: 0 0 22px rgba(56,189,248,0.34);
}
.page-loader__progress-sweep {
  position: absolute;
  top: 0;
  bottom: 0;
  left: -28%;
  width: 26%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.12) 20%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0.12) 80%, transparent 100%);
  animation: bwLoaderSweep 2.2s linear infinite;
}
.page-loader__pct {
  margin-top: 12px;
  font-size: 11px;
  font-weight: 800;
  color: #cbd5e1;
}
.page-loader__pct strong { color: #f8fafc; }
@keyframes bwLoaderSweep {
  0% { transform: translateX(-140%) skewX(-18deg); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateX(240%) skewX(-18deg); opacity: 0; }
}
@keyframes bwLoaderPulse {
  0%, 100% { transform: scale(1); opacity: 0.65; }
  50% { transform: scale(1.06); opacity: 1; }
}
@keyframes bwLoaderFloat {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
}

h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 28px; line-height: 1.1; }

/* Tabs */
.tabs-wrap { margin-bottom: 20px; }
.tabs { display: inline-flex; gap: 2px; background: var(--bg3); border-radius: 10px; padding: 3px; }
.tab { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: 500 13px 'Inter',sans-serif; cursor: pointer; transition: all .18s; white-space: nowrap; }
.tab.active { background: var(--bg); color: var(--text); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

.metric-switch-wrap { margin-bottom: 16px; }
.metric-switch {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 12px;
  background: #eef2ff;
  border: 1px solid #dbe3ff;
}
.metric-btn {
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #475569;
  font: 700 12px 'Inter',sans-serif;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all .18s ease;
}
.metric-btn.active {
  background: #ffffff;
  color: #1e293b;
  box-shadow: 0 1px 4px rgba(15,23,42,0.12);
}

/* Search */
.search-wrap { position: relative; margin-bottom: 0; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--hint); pointer-events: none; display: flex; align-items: center; }
.search-input { width: 100%; height: 40px; padding-left: 36px; padding-right: 14px; border: none; border-bottom: 1px solid var(--border); background: transparent; font: 14px 'Inter',sans-serif; color: var(--text); }
.search-input::placeholder { color: #c4c4cf; }
.search-input:focus { outline: none; }

/* Table header */
.table-head { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--bg3); font-weight: 600; font-size: 12px; color: var(--muted); }
.th-rank { width: 32px; flex-shrink: 0; }
.th-avatar { width: 48px; flex-shrink: 0; }
.th-name { flex: 1; }
.th-cols { display: flex; gap: 48px; flex-shrink: 0; }
.sort-btn { border: 0; background: none; padding: 4px 0; font: 700 13px 'Inter',sans-serif; cursor: pointer; color: var(--hint); border-bottom: 2px solid transparent; transition: all .18s; min-width: 100px; text-align: right; }
.sort-btn.active { color: var(--text); border-bottom-color: var(--text); }
.sort-btn:hover { color: var(--text); }

/* Rows */
.lb-row { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border2); cursor: default; transition: background .15s; }
.lb-row:hover { background: var(--bg2); }
.row-rank { width: 32px; flex-shrink: 0; display: flex; align-items: center; }
.row-rank .num { font-size: 13px; font-weight: 600; color: var(--hint); }
.row-rank .medal { font-size: 20px; line-height: 1; }
.row-avatar { width: 48px; flex-shrink: 0; }
.avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; letter-spacing: -0.02em; flex-shrink: 0; user-select: none; }
.row-name { flex: 1; min-width: 0; padding-left: 14px; user-select: none; display: flex; flex-direction: column; gap: 6px; }
.row-name-main { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.affiliate-pill {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,0.28);
  background: #f8fafc;
  color: #475569;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-cols { display: flex; gap: 48px; align-items: center; flex-shrink: 0; }
.row-profit { font: 700 15px/1 'Inter',sans-serif; color: var(--green); letter-spacing: -0.03em; min-width: 100px; text-align: right; }
.row-volume { font: 500 14px/1 'Inter',sans-serif; color: var(--hint); letter-spacing: -0.02em; min-width: 100px; text-align: right; }
.no-results { padding: 48px 16px; text-align: center; color: var(--hint); font-size: 14px; font-weight: 500; display: none; }

/* Scope badge */
.scope-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg3);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: -0.01em;
  margin-bottom: 22px;
  transition: background .18s, border-color .18s;
}
.scope-badge .scope-icon {
  display: flex; align-items: center;
  color: var(--hint);
}
.scope-badge .scope-value {
  font-weight: 800;
  color: var(--text);
}
.scope-badge.is-global .scope-icon svg { color: #6366f1; }
.scope-badge.is-global .scope-value { color: #6366f1; }

/* Sidebar */
.sidebar { width: 360px; flex-shrink: 0; }
.wins-card { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.wins-head { padding: 16px 18px; border-bottom: 1px solid var(--border2); font-size: 15px; font-weight: 700; letter-spacing: -0.025em; }
.win-row { display: flex; align-items: center; gap: 10px; padding: 11px 18px; cursor: default; }
.win-row + .win-row { border-top: 1px solid var(--border2); }
.win-rank { font-size: 12px; font-weight: 600; color: #c4c4cf; width: 14px; flex-shrink: 0; }
.win-info { flex: 1; min-width: 0; }
.win-names { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; margin-bottom: 3px; }
.win-name { font-size: 13px; font-weight: 700; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; user-select: none; }
.win-market { font-size: 11px; color: var(--hint); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
.win-amounts { display: flex; align-items: center; gap: 4px; font: 400 12px/1 'Inter',sans-serif; }
.win-prev { color: var(--hint); }
.win-arrow { color: var(--green); display: flex; align-items: center; }
.win-gain { color: var(--green); font-weight: 600; }

/* Footer */
.footer {
  background: var(--nav-bg); border-top: 1px solid var(--nav-border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  height: 52px; display: flex; align-items: center; padding: 0 20px; gap: 16px;
}
.footer-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }
.footer-logo { width: 20px; height: 20px; border-radius: 6px; display: block; overflow: hidden; }
.footer-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.footer-name { font-size: 12px; font-weight: 800; letter-spacing: -0.02em; color: var(--muted); }
.footer-spacer { flex: 1; }
.footer-note { font-size: 11px; color: var(--hint); font-weight: 500; }

/* Animations */
@keyframes fade-up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.anim { animation: fade-up .3s ease both; }
@keyframes reveal-soft {
  0% { opacity: 0; transform: translateY(12px) scale(0.995); filter: blur(4px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
.reveal-soft {
  animation: reveal-soft .42s cubic-bezier(.2,.7,.2,1) both;
  will-change: transform, opacity, filter;
}

/* Responsive */
@media (max-width: 1024px) {
  .navbar-shell { gap: 16px; }
  .navbar-center-title { font-size: 20px; }
  .affiliate-picker { min-width: 170px; max-width: 220px; }
  .layout { flex-direction: column; }
  .sidebar { width: 100%; }
}

@media (max-width: 768px) {
  .navbar { padding: 10px 12px; }
  .navbar-shell { 
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    padding: 8px 12px;
    min-height: 56px;
  }
  .navbar-center-stack { gap: 6px; }
  .navbar-center-title { font-size: 16px; font-weight: 700; }
  .affiliate-picker-wrap { padding: 5px 10px; }
  .affiliate-picker-label { display: none; }
  .affiliate-picker { min-width: 150px; max-width: 180px; font-size: 11px; }
  .pill { font-size: 11px; height: 30px; padding: 0 12px; }
  .navbar-pills { gap: 8px; }
  .page-body { padding: 24px 16px 48px; }
  h1 { font-size: 28px; margin-bottom: 18px; }
  .metric-btn { height: 30px; padding: 0 12px; font-size: 11px; }
  .row-volume { display: none; }
  .sort-btn:last-child { display: none; }
  .th-cols { gap: 24px; }
}

@media (max-width: 600px) {
  .navbar { padding: 8px 10px; }
  .navbar-shell { 
    grid-template-columns: auto 1fr;
    gap: 10px;
    padding: 8px 10px;
    min-height: 50px;
  }
  .navbar-center { display: none; }
  .navbar-logo { width: 36px; height: 36px; }
  .navbar-title { font-size: 13px; }
  .pill-outline { display: none; }
  .navbar-pills { gap: 6px; }
  .pill { font-size: 10px; height: 28px; padding: 0 10px; }
  .page-body { padding: 20px 12px 40px; }
  h1 { font-size: 24px; margin-bottom: 16px; }
  .search-input { height: 36px; font-size: 13px; }
  .lb-row { padding: 12px 12px; }
  .row-name { gap: 4px; }
  .affiliate-pill { font-size: 10px; padding: 2px 8px; }
  .row-profit { font-size: 14px; min-width: 80px; }
  .sidebar { margin-top: 20px; }
  .wins-card { max-height: 300px; overflow-y: auto; }
}
</style>
</head>
<body>

<div id="page-loader" class="page-loader" aria-live="polite" aria-busy="true">
  <div class="page-loader__inner">
    <div class="page-loader__orb">
      <div class="page-loader__ring" aria-hidden="true"></div>
      <div class="page-loader__ring-2" aria-hidden="true"></div>
      <img src="./Logo.png" alt="Bullwaves logo" loading="eager" decoding="async"/>
    </div>
    <div id="page-loader-label" class="page-loader__subtitle">Loading leaderboard…</div>
    <div class="page-loader__progress">
      <div id="page-loader-progress" class="page-loader__progress-fill"></div>
      <div class="page-loader__progress-sweep" aria-hidden="true"></div>
    </div>
    <div class="page-loader__pct"><strong id="page-loader-pct">0%</strong></div>
  </div>
</div>

<nav class="navbar">
  <div class="navbar-shell">
    <a class="navbar-brand" href="https://bullwaves.com" target="_blank" rel="noopener noreferrer">
      <div class="navbar-logo">
        <img src="./Logo.png" alt="Bullwaves logo" loading="eager" decoding="async"/>
      </div>
      <div class="navbar-branding">
        <div class="navbar-title">Bullwaves</div>
        <div class="navbar-subtitle">Trading</div>
      </div>
    </a>
    <div class="navbar-center">
      <div class="navbar-center-stack">
        <div class="navbar-center-title">Trading Competition</div>
        <div class="affiliate-picker-wrap">
          <span class="affiliate-picker-label">Affiliate</span>
          <select id="affiliate-picker" class="affiliate-picker" aria-label="Choose affiliate" onchange="onAffiliateChange(event)">
            <option value="">General leaderboard · All affiliates</option>
          </select>
        </div>
      </div>
    </div>
    <div class="navbar-pills">
      <span class="live-dot"></span>

<script>
// Deregister any Vite/Workbox service worker that may intercept API calls on this standalone page.
(function clearSW() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    if (!regs.length) return;
    if (sessionStorage.getItem('_sw_cleared')) return;
    sessionStorage.setItem('_sw_cleared', '1');
    Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
      window.location.reload();
    });
  });
})();

const DEFAULT_AFFILIATE_ID = '';
const REFRESH_MS = 60000;
const LEADERBOARD_LIMIT = 200;

const COLORS = [
  ["#6366f1","#8b5cf6"],["#ec4899","#f43f5e"],["#10b981","#059669"],
  ["#f59e0b","#ef4444"],["#3b82f6","#06b6d4"],["#8b5cf6","#ec4899"],
  ["#14b8a6","#6366f1"],["#f97316","#eab308"],["#e879f9","#a855f7"],
  ["#22d3ee","#10b981"],["#fb7185","#f472b6"],["#a3e635","#4ade80"],
  ["#fbbf24","#f97316"],["#60a5fa","#818cf8"],["#34d399","#059669"],
  ["#f87171","#fb923c"],["#c084fc","#e879f9"],["#38bdf8","#0284c7"],
  ["#4ade80","#16a34a"],["#facc15","#eab308"],
];

let currentSort = 'profit';
let currentSearch = '';
let currentPeriod = 'all';
let currentPlMode = normalizePlMode(new URLSearchParams(window.location.search).get('plMode'));
let currentAffiliateId = normalizeAffiliateId(new URLSearchParams(window.location.search).get('affiliateId')) || DEFAULT_AFFILIATE_ID;
let USERS = [];
let TODAY_USERS = [];
let loadToken = 0;
let isLoadingLeaderboard = false;
let hasPlayedFirstReveal = false;
let loaderProgress = 0;
let loaderProgressTimer = null;
let navbarRafId = 0;
let lastShrinkState = null;
let affiliateNameById = new Map();

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normalizeAffiliateId(value) {
  const normalized = String(value || '').trim();
  if (!normalized || normalized === '__all__' || normalized.toLowerCase() === 'all') return '';
  return normalized;
}

function normalizePlMode(value) {
  return String(value || '').trim().toLowerCase() === 'open' ? 'open' : 'closed';
}

function normalizeAffiliateName(value) {
  return String(value || '').trim();
}

function getAffiliateDisplayName(affiliateId, fallback) {
  const key = normalizeAffiliateId(affiliateId);
  const fromMap = key ? normalizeAffiliateName(affiliateNameById.get(key)) : '';
  if (fromMap) return fromMap;
  const fb = normalizeAffiliateName(fallback);
  if (fb) return fb;
  if (key) return key;
  return 'Unknown affiliate';
}

function toAffiliateUiName(affiliateId, fallback) {
  const key = normalizeAffiliateId(affiliateId);
  const name = getAffiliateDisplayName(key, fallback);
  if (!key) return name;
  if (!name || name === key) return `Affiliate ${key}`;
  return name;
}

function parseCsvRow(line) {
  const out = [];
  let token = '';
  let quoted = false;
  for (let i = 0; i < line.length; i += 1) {
    const ch = line[i];
    if (ch === '"') {
      if (quoted && line[i + 1] === '"') {
        token += '"';
        i += 1;
      } else {
        quoted = !quoted;
      }
      continue;
    }
    if (ch === ',' && !quoted) {
      out.push(token);
      token = '';
      continue;
    }
    token += ch;
  }
  out.push(token);
  return out.map((value) => value.trim());
}

async function loadAffiliateNameMap() {
  const next = new Map();

  try {
    const res = await fetch('/affiliate_index.json', { cache: 'no-store' });
    if (res.ok) {
      const payload = await res.json();
      const byId = payload && typeof payload.byId === 'object' ? payload.byId : null;
      if (byId) {
        for (const [id, name] of Object.entries(byId)) {
          const key = normalizeAffiliateId(id);
          const value = normalizeAffiliateName(name);
          if (key && value) next.set(key, value);
        }
      }
    }
  } catch {
    // Best-effort enrichment only.
  }

  try {
    const res = await fetch('/Payments Report.csv', { cache: 'no-store' });
    if (res.ok) {
      const text = await res.text();
      const lines = String(text || '').split(/\r?\n/).filter(Boolean);
      if (lines.length > 1) {
        const header = parseCsvRow(lines[0]).map((h) => h.toLowerCase());
        const idIdx = header.indexOf('affiliate_id');
        const nameIdx = header.indexOf('affiliate');
        if (idIdx >= 0 && nameIdx >= 0) {
          for (let i = 1; i < lines.length; i += 1) {
            const cols = parseCsvRow(lines[i]);
            const key = normalizeAffiliateId(cols[idIdx]);
            const value = normalizeAffiliateName(cols[nameIdx]);
            if (key && value) next.set(key, value);
          }
        }
      }
    }
  } catch {
    // Best-effort enrichment only.
  }

  affiliateNameById = next;
  return next;
}

function buildAffiliateLabel(affiliateId, tradersCount) {
  if (!normalizeAffiliateId(affiliateId)) {
    const count = Number(tradersCount || 0);
    if (count > 0) return `General leaderboard · ${count} traders`;
    return 'General leaderboard · All affiliates';
  }
  const name = toAffiliateUiName(affiliateId);
  const count = Number(tradersCount || 0);
  const lower = String(name || '').toLowerCase();
  const base = !affiliateId || name.includes(`(${affiliateId})`) || lower === `affiliate ${String(affiliateId).toLowerCase()}`
    ? name
    : `${name} (${affiliateId})`;
  if (count > 0) return `${base} · ${count} traders`;
  return base;
}

function syncAffiliatePickerOptions(options) {
  const picker = document.getElementById('affiliate-picker');
  if (!picker) return;
  const normalized = Array.isArray(options) ? options.slice() : [];
  normalized.unshift({ value: '', label: buildAffiliateLabel('', 0) });
  if (!normalized.some((option) => option.value === currentAffiliateId)) {
    normalized.unshift({ value: currentAffiliateId, label: buildAffiliateLabel(currentAffiliateId, 0) });
  }
  const deduped = [];
  const seen = new Set();
  for (const option of normalized) {
    const key = normalizeAffiliateId(option?.value);
    if (seen.has(key)) continue;
    seen.add(key);
    deduped.push({ value: key, label: option.label });
  }
  picker.innerHTML = deduped.map((option) => (
    `<option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>`
  )).join('');
  picker.value = currentAffiliateId;
}

async function loadAffiliateOptions() {
  const params = new URLSearchParams();
  params.set('limit', '500');
  const res = await fetch(`/api/qlik/creolabs/db-native/leaderboard?${params.toString()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const payload = await res.json();
  const entries = Array.isArray(payload?.data?.leaderboard) ? payload.data.leaderboard : [];
  const counts = new Map();
  for (const entry of entries) {
    const affiliateId = normalizeAffiliateId(entry?.affiliateId);
    if (!affiliateId) continue;
    counts.set(affiliateId, (counts.get(affiliateId) || 0) + 1);
  }
  return Array.from(counts.entries())
    .map(([value, count]) => ({ value, label: buildAffiliateLabel(value, count), count }))
    .sort((a, b) => {
      if (a.value === currentAffiliateId) return -1;
      if (b.value === currentAffiliateId) return 1;
      return b.count - a.count || a.value.localeCompare(b.value);
    });
}

async function hydrateAffiliatePicker() {
  try {
    await loadAffiliateNameMap();
    const options = await loadAffiliateOptions();
    if (options.length) syncAffiliatePickerOptions(options);
    renderTable();
    renderWins();
  } catch {
    syncAffiliatePickerOptions([{ value: currentAffiliateId, label: buildAffiliateLabel(currentAffiliateId, 0) }]);
  }
}

function updateAffiliateUrlParam() {
  const url = new URL(window.location.href);
  if (currentAffiliateId) url.searchParams.set('affiliateId', currentAffiliateId);
  else url.searchParams.delete('affiliateId');
  if (currentPlMode === 'open') url.searchParams.set('plMode', 'open');
  else url.searchParams.delete('plMode');
  window.history.replaceState({}, '', url.toString());
}

function updatePlModeUi() {
  const closedBtn = document.getElementById('metric-closed');
  const openBtn = document.getElementById('metric-open');
  if (closedBtn) closedBtn.classList.toggle('active', currentPlMode === 'closed');
  if (openBtn) openBtn.classList.toggle('active', currentPlMode === 'open');

  const sortProfitLabel = document.getElementById('sort-profit');
  if (sortProfitLabel) sortProfitLabel.textContent = currentPlMode === 'open' ? 'Open P/L' : 'Closed P/L';
}

function setPlMode(mode) {
  const next = normalizePlMode(mode);
  if (next === currentPlMode) return;
  currentPlMode = next;
  updatePlModeUi();
  updateAffiliateUrlParam();
  loadCompetitionData();
}

function updateLeaderboardHeader() {
  const titleEl = document.getElementById('leaderboard-title');
  const badgeEl = document.getElementById('scope-badge');
  const scopeValueEl = document.getElementById('scope-value');
  const isGlobal = !currentAffiliateId;

  if (titleEl) titleEl.textContent = isGlobal ? 'Global Leaderboard' : 'Leaderboard';

  if (badgeEl) {
    badgeEl.classList.toggle('is-global', isGlobal);
  }
  if (scopeValueEl) {
    if (isGlobal) {
      scopeValueEl.textContent = 'All affiliates';
    } else {
      const name = toAffiliateUiName(currentAffiliateId);
      scopeValueEl.textContent = name;
    }
  }
}

function onAffiliateChange(event) {
  const nextAffiliateId = normalizeAffiliateId(event?.target?.value);
  if (nextAffiliateId === currentAffiliateId) return;
  currentAffiliateId = nextAffiliateId;
  updateAffiliateUrlParam();
  updateLeaderboardHeader();
  loadCompetitionData();
}

function setLoaderProgress(value) {
  loaderProgress = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
  const fill = document.getElementById('page-loader-progress');
  const pct = document.getElementById('page-loader-pct');
  if (fill) fill.style.width = `${loaderProgress}%`;
  if (pct) pct.textContent = `${loaderProgress}%`;
}

function showLoader(label, options = {}) {
  const overlay = options.overlay !== false;
  isLoadingLeaderboard = true;
  const overlayEl = document.getElementById('page-loader');
  const overlayLabel = document.getElementById('page-loader-label');
  const noRes = document.getElementById('no-results');
  if (overlayEl) {
    if (overlay) overlayEl.classList.remove('is-hidden');
    else overlayEl.classList.add('is-hidden');
  }
  if (overlayLabel && label) overlayLabel.textContent = label;
  if (overlay) {
    if (loaderProgressTimer) clearInterval(loaderProgressTimer);
    setLoaderProgress(18);
    loaderProgressTimer = setInterval(() => {
      if (loaderProgress < 84) setLoaderProgress(loaderProgress + 4);
    }, 260);
  }
  if (noRes) noRes.style.display = 'none';
}

function hideLoader() {
  isLoadingLeaderboard = false;
  const overlayEl = document.getElementById('page-loader');
  if (loaderProgressTimer) {
    clearInterval(loaderProgressTimer);
    loaderProgressTimer = null;
  }
  setLoaderProgress(100);
  window.setTimeout(() => {
    if (overlayEl) overlayEl.classList.add('is-hidden');
    setLoaderProgress(0);
  }, 180);
}

function applyNavbarShrink() {
  const nav = document.querySelector('.navbar');
  if (!nav) return;
  const shouldShrink = window.scrollY > 28;
  if (shouldShrink === lastShrinkState) return;
  nav.classList.toggle('is-shrunk', shouldShrink);
  lastShrinkState = shouldShrink;
}

function onNavbarScroll() {
  if (navbarRafId) return;
  navbarRafId = window.requestAnimationFrame(() => {
    navbarRafId = 0;
    applyNavbarShrink();
  });
}

function toYmd(d) {
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth()+1).padStart(2,'0');
  const day = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function subtractDays(d, days) {
  return new Date(d.getTime() - Math.max(0, Number(days||0)) * 86400000);
}

function getDateRange(periodId) {
  const now = new Date();
  if (periodId === 'today') { const y = toYmd(now); return {from:y, to:y}; }
  if (periodId === 'weekly') return {from: toYmd(subtractDays(now,6)), to: toYmd(now)};
  if (periodId === 'monthly') {
    const s = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
    return {from: toYmd(s), to: toYmd(now)};
  }
  return {from:'', to:''};
}

function periodLabel(id) {
  if (id === 'today') return "Loading today's traders…";
  if (id === 'weekly') return "Loading this week's traders…";
  if (id === 'monthly') return "Loading this month's traders…";
  return 'Loading leaderboard…';
}

function periodFromTabButton(btn) {
  const txt = String(btn?.textContent||'').trim().toLowerCase();
  if (txt === 'today') return 'today';
  if (txt === 'weekly') return 'weekly';
  if (txt === 'monthly') return 'monthly';
  return 'all';
}

function formatYmdLabel(ymd) {
  const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return String(ymd || '');
  const d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  return d.toLocaleDateString('en-GB', {
    day: '2-digit',
    month: 'short',
    year: 'numeric',
    timeZone: 'UTC',
  });
}

function timeframeText(periodId) {
  if (periodId === 'all') return 'all time';
  const r = getDateRange(periodId);
  if (!r.from || !r.to) return 'selected timeframe';
  if (periodId === 'today') return `today (${formatYmdLabel(r.from)})`;
  if (periodId === 'monthly') return `this month (${formatYmdLabel(r.from)} - ${formatYmdLabel(r.to)})`;
  if (periodId === 'weekly') return `this week (${formatYmdLabel(r.from)} - ${formatYmdLabel(r.to)})`;
  return `${formatYmdLabel(r.from)} - ${formatYmdLabel(r.to)}`;
}

function noTradersMessage(periodId, searchText) {
  const tf = timeframeText(periodId);
  const q = String(searchText || '').trim();
  if (q) return `No traders found for "${q}" in ${tf}.`;
  if (periodId === 'today') return `No trading data yet for ${tf}.`;
  return `No traders found in ${tf}.`;
}

function fmt(n, sign) {
  const abs = Math.abs(Number(n||0));
  let s;
  if (abs >= 1e6) s = "$"+(abs/1e6).toFixed(2)+"M";
  else if (abs >= 1e3) s = "$"+Math.floor(abs/1e3).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")+"K";
  else s = "$"+abs.toLocaleString();
  return (sign && Number(n||0) > 0) ? "+"+s : (Number(n||0) < 0 ? "-"+s : s);
}

function avatarHTML(user, size) {
  const c = user.c || COLORS[0];
  const first = String(user.name||'?').trim().charAt(0).toUpperCase()||'?';
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.floor(size*0.38)}px;background:linear-gradient(135deg,${c[0]},${c[1]})">${first}</div>`;
}

function rankHTML(rank) {
  if (rank===1) return '<span class="medal">&#x1F947;</span>';
  if (rank===2) return '<span class="medal">&#x1F948;</span>';
  if (rank===3) return '<span class="medal">&#x1F949;</span>';
  return `<span class="num">${rank}</span>`;
}

function normalizeUserRow(row, i) {
  const closedPl = Number(row?.closedPl||0);
  const openPl = Number(row?.openPl||0);
  const selectedPl = Number((row?.profitMetric ?? (currentPlMode === 'open' ? openPl : closedPl)) || 0);
  const trades = Number(row?.trades||row?.volume||0);
  const country = String(row?.country||'').trim()||'N/A';
  const clientLogin = String(row?.clientLogin||'').trim()||'N/A';
  const affiliateId = normalizeAffiliateId(row?.affiliateId);
  const affiliateName = toAffiliateUiName(affiliateId, row?.affiliateName || row?.affiliate);
  const name = String(row?.clientName||'').trim()||`Client ${String(row?.clientId||'').trim()||'Unknown'}`;
  const positive = Math.max(0, selectedPl);
  return {
    id: `${String(row?.clientId||'').trim()}-${String(row?.clientLogin||'').trim()}`||`row-${i}`,
    name, profit: selectedPl,
    closedPl,
    openPl,
    affiliateId,
    affiliateName,
    volume: Number.isFinite(trades) ? Math.max(0, Math.round(trades)) : 0,
    prev: Math.max(0, Math.round(positive*0.75)),
    gain: Math.max(0, Math.round(positive)),
    market: `${country} · ${clientLogin}`,
    c: COLORS[i % COLORS.length],
  };
}

function dedupeRowsByClient(rows) {
  const m = new Map();
  for (const row of Array.isArray(rows)?rows:[]) {
    const key = String(row?.id||'').trim()||String(row?.name||'').trim();
    const ts = Date.parse(String(row?.clientTimestamp||''));
    const prev = m.get(key);
    if (!prev) { m.set(key, row); continue; }
    const pts = Date.parse(String(prev?.clientTimestamp||''));
    if (Number.isFinite(ts) && (!Number.isFinite(pts)||ts>=pts)) m.set(key,row);
  }
  return Array.from(m.values());
}

function renderTable() {
  const body = document.getElementById('table-body');
  const noRes = document.getElementById('no-results');
  if (isLoadingLeaderboard) {
    if (body) body.innerHTML='';
    if (noRes) noRes.style.display='none';
    return;
  }
  const q = currentSearch.toLowerCase();
  const list = dedupeRowsByClient(USERS)
    .filter(u => u.name.toLowerCase().includes(q))
    .sort((a,b) => currentSort==='profit' ? b.profit-a.profit : b.volume-a.volume);
  if (!list.length) {
    body.innerHTML='';
    noRes.style.display='block';
    noRes.textContent = noTradersMessage(currentPeriod, currentSearch);
    return;
  }
  noRes.style.display='none';
  const useFirstReveal = !hasPlayedFirstReveal;
  body.innerHTML = list.map((u,i) => `
    <div class="lb-row ${useFirstReveal ? 'reveal-soft' : 'anim'}" style="animation-delay:${i*20}ms">
      <div class="row-rank">${rankHTML(i+1)}</div>
      <div class="row-avatar">${avatarHTML(u,36)}</div>
      <div class="row-name">
        <div class="row-name-main">${escapeHtml(u.name)}</div>
        ${currentAffiliateId ? '' : `<span class="affiliate-pill">${escapeHtml(u.affiliateName)}</span>`}
      </div>
      <div class="row-cols">
        <span class="row-profit">${fmt(u.profit,true)}</span>
        <span class="row-volume">${u.volume.toLocaleString()}</span>
      </div>
    </div>`).join('');
}

function renderWins() {
  const source = dedupeRowsByClient(TODAY_USERS.length?TODAY_USERS:USERS);
  const top = source.filter(u=>Number(u.gain||0)>0).sort((a,b)=>b.gain-a.gain).slice(0,8);
  const useFirstReveal = !hasPlayedFirstReveal;
  document.getElementById('wins-body').innerHTML = top.map((u,i) => `
    <div class="win-row ${useFirstReveal ? 'reveal-soft' : 'anim'}" style="animation-delay:${120+i*40}ms">
      <div class="win-rank">${i+1}</div>
      ${avatarHTML(u,32)}
      <div class="win-info">
        <div class="win-names">
          <span class="win-name">${u.name}</span>
          <span class="win-market">${u.market}</span>
        </div>
        <div class="win-amounts">
          <span class="win-prev">${fmt(u.prev)}</span>
          <span class="win-arrow">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00a878" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
          <span class="win-gain">${fmt(u.gain)}</span>
        </div>
      </div>
    </div>`).join('');
}

function setSort(type) {
  currentSort = type;
  document.getElementById('sort-profit').classList.toggle('active', type==='profit');
  document.getElementById('sort-volume').classList.toggle('active', type==='volume');
  loadCompetitionData();
}

function filterRows() {
  currentSearch = document.getElementById('search').value;
  renderTable();
}

async function fetchLeaderboard(sortBy, periodId, options = {}) {
  const params = new URLSearchParams();
  const affiliateId = normalizeAffiliateId(options.affiliateId == null ? currentAffiliateId : options.affiliateId);
  if (affiliateId) params.set('affiliateId', affiliateId);
  params.set('limit', String(options.limit || LEADERBOARD_LIMIT));
  params.set('plMode', currentPlMode);
  params.set('sortBy', sortBy||'profit');
  const range = getDateRange(periodId||'all');
  if (range.from) params.set('from', range.from);
  if (range.to) params.set('to', range.to);
  const res = await fetch(`/api/qlik/creolabs/db-native/leaderboard?${params.toString()}`, {cache:'no-store'});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const payload = await res.json();
  const entries = Array.isArray(payload?.data?.leaderboard) ? payload.data.leaderboard : [];
  return entries.map(normalizeUserRow);
}

async function loadCompetitionData(options = {}) {
  const overlay = options.overlay !== false;
  const token = ++loadToken;
  showLoader(periodLabel(currentPeriod), { overlay });
  try {
    const users = await fetchLeaderboard(currentSort, currentPeriod);
    if (token !== loadToken) return;
    USERS = users; TODAY_USERS = [];
    hideLoader();
    renderTable(); renderWins();
    if (users.length && !hasPlayedFirstReveal) hasPlayedFirstReveal = true;
  } catch(e) {
    if (token !== loadToken) return;
    USERS = []; TODAY_USERS = [];
    hideLoader();
    document.getElementById('wins-body').innerHTML='';
    const noRes = document.getElementById('no-results');
    noRes.style.display='block';
    noRes.textContent='Unable to load leaderboard right now.';
  }
}

function setTab(btn) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = periodFromTabButton(btn);
  loadCompetitionData();
}

syncAffiliatePickerOptions([{ value: currentAffiliateId, label: buildAffiliateLabel(currentAffiliateId, 0) }]);
hydrateAffiliatePicker();
updatePlModeUi();
updateAffiliateUrlParam();
updateLeaderboardHeader();
loadCompetitionData();
applyNavbarShrink();
window.addEventListener('scroll', onNavbarScroll, { passive: true });
window.setInterval(() => loadCompetitionData({ overlay: false }), REFRESH_MS);
</script>
</body>
</html>
