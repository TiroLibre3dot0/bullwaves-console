<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullwaves Trustpilot Popup</title>
    <style>
      :root {
        --page-bg: #eaf5ff;
        --card-bg: #ffffff;
        --card-border: #d9e8f7;
        --logo-panel: #0e1b2f;
        --text-main: #101828;
        --text-sub: #344054;
        --star-yellow: #f5c518;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-main);
        background: radial-gradient(circle at 20% 10%, #ffffff 0%, var(--page-bg) 46%, #dceeff 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 18px;
      }

      .popup {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        box-shadow: 0 14px 38px rgba(16, 24, 40, 0.12);
        width: min(100%, 760px);
        min-height: 210px;
        padding: 20px;
        display: grid;
        grid-template-columns: 190px 1fr;
        column-gap: 22px;
        align-items: center;
      }

      .logo-panel {
        height: 100%;
        border-radius: 14px;
        background: linear-gradient(165deg, #14284a 0%, var(--logo-panel) 100%);
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .brand-logo {
        width: 146px;
        max-width: 100%;
        height: auto;
      }

      .title {
        margin: 0;
        font-size: clamp(28px, 3.2vw, 40px);
        line-height: 1.08;
        letter-spacing: -0.2px;
        font-weight: 700;
      }

      .stars {
        margin: 10px 0 12px;
        display: flex;
        gap: 6px;
      }

      .subtitle {
        margin: 0;
        font-size: clamp(18px, 2.1vw, 28px);
        line-height: 1.2;
        color: var(--text-sub);
      }

      svg {
        display: block;
      }

      @media (max-width: 760px) {
        .popup {
          grid-template-columns: 1fr;
          min-height: auto;
          row-gap: 16px;
        }

        .logo-panel {
          min-height: 92px;
        }

        .brand-logo {
          width: 132px;
        }

        .title {
          font-size: clamp(26px, 7vw, 36px);
        }
      }
    </style>
  </head>
  <body>
    <section class="popup" role="dialog" aria-label="Richiesta feedback Trustpilot">
      <div class="logo-panel" aria-hidden="true">
        <img class="brand-logo" src="/Logo.png" alt="Bullwaves" />
      </div>

      <div>
        <h1 class="title">Cosa ne pensi di Bullwaves?</h1>

        <div class="stars" aria-label="Valutazione a cinque stelle">
          <svg width="34" height="34" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="var(--star-yellow)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
          <svg width="34" height="34" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="var(--star-yellow)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
          <svg width="34" height="34" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="var(--star-yellow)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
          <svg width="34" height="34" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="var(--star-yellow)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
          <svg width="34" height="34" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="var(--star-yellow)" d="M12 2.8L14.73 8.33L20.83 9.22L16.42 13.52L17.46 19.6L12 16.73L6.54 19.6L7.58 13.52L3.17 9.22L9.27 8.33L12 2.8Z"/></svg>
        </div>

        <p class="subtitle">Lascia il tuo feedback su Trustpilot</p>
      </div>
    </section>
  </body>
</html>
