name: Lint & Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Avoid git hook installation in CI.
      HUSKY: '0'
      # Puppeteer is not needed for lint/build; skipping the Chromium download
      # makes installs faster and prevents flaky CI failures.
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false
      
      - name: Build project
        run: npm run build
        continue-on-error: false
      
      - name: Check for syntax errors
        run: |
          node -c src/main.jsx || true
          node -c src/App.jsx || true
